{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-danger text-white">
            <h3>Delete Sales Member</h3>
        </div>

        <div class="card-body">

            <p>Are you sure you want to delete this sales member?</p>

            <p>
                <strong>Name:</strong>
                {{ member.get_full_name }}
            </p>

            <p>
                <strong>Username:</strong>
                {{ member.username }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ member.email }}
            </p>

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'sales_members' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
