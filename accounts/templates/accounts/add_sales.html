{% extends "base.html" %}

{% block content %}

<style>

    /* ==============================
       PAGE
    ============================== */

    .sales-page {
        min-height: calc(100vh - 100px);
        padding: 40px 20px;
        background: #f4f6f9;
    }


    /* ==============================
       CARD
    ============================== */

    .sales-card {
        width: 100%;
        max-width: 800px;
        margin: 20px auto;

        background: #ffffff;

        border-radius: 16px;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.10);

        overflow: hidden;
    }


    /* ==============================
       HEADER
    ============================== */

    .sales-header {
        background: #0B2D52;
        color: white;

        padding: 28px 35px;
    }

    .sales-header h2 {
        margin: 0;

        font-size: 30px;
        font-weight: 700;
    }

    .sales-header p {
        margin: 7px 0 0;

        font-size: 15px;

        color: #dce8f5;
    }


    /* ==============================
       FORM BODY
    ============================== */

    .sales-body {
        padding: 35px;
    }


    /* ==============================
       FORM LABEL
    ============================== */

    .sales-body label {
        display: block;

        margin-bottom: 8px;

        font-size: 15px;

        font-weight: 600;

        color: #263238;
    }


    /* ==============================
       FORM INPUT
    ============================== */

    .sales-body input {
        width: 100%;

        height: 48px;

        padding: 10px 14px;

        border: 1px solid #d4dce5;

        border-radius: 8px;

        background: white;

        font-size: 15px;

        outline: none;

        transition: 0.2s;
    }


    .sales-body input:focus {
        border-color: #1565c0;

        box-shadow:
            0 0 0 3px
            rgba(21, 101, 192, 0.12);
    }


    /* ==============================
       DJANGO FORM PARAGRAPHS
    ============================== */

    .sales-body p {
        margin-bottom: 20px;
    }


    /* ==============================
       HELP TEXT
    ============================== */

    .sales-body .helptext {
        display: block;

        margin-top: 5px;

        color: #7b8794;

        font-size: 13px;
    }


    /* ==============================
       ERROR
    ============================== */

    .sales-body .errorlist {
        margin: 5px 0 0;

        padding: 0;

        list-style: none;

        color: #dc3545;

        font-size: 13px;
    }


    /* ==============================
       BUTTON AREA
    ============================== */

    .button-area {
        display: flex;

        justify-content: flex-end;

        gap: 12px;

        margin-top: 30px;

        padding-top: 25px;

        border-top: 1px solid #e5e7eb;
    }


    /* ==============================
       SAVE BUTTON
    ============================== */

    .btn-save {
        border: none;

        background: #198754;

        color: white;

        padding: 12px 28px;

        border-radius: 8px;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;
    }


    .btn-save:hover {
        background: #157347;
    }


    /* ==============================
       CANCEL BUTTON
    ============================== */

    .btn-cancel {
        display: inline-block;

        background: #6c757d;

        color: white;

        text-decoration: none;

        padding: 12px 25px;

        border-radius: 8px;

        font-size: 15px;

        font-weight: 600;

        transition: 0.2s;
    }


    .btn-cancel:hover {
        background: #5c636a;

        color: white;
    }


    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 600px) {

        .sales-page {
            padding: 20px 10px;
        }

        .sales-body {
            padding: 25px 20px;
        }

        .sales-header {
            padding: 22px 20px;
        }

        .sales-header h2 {
            font-size: 24px;
        }

        .button-area {
            flex-direction: column;
        }

        .btn-save,
        .btn-cancel {
            width: 100%;
            text-align: center;
        }

    }

</style>


<!-- ==========================================
     SALES MEMBER PAGE
=========================================== -->

<div class="sales-page">

    <div class="sales-card">


        <!-- HEADER -->

        <div class="sales-header">

            <h2>
                <i class="fa-solid fa-user-plus"></i>
                Add Sales Member
            </h2>

            <p>
                Create a new sales member account
            </p>

        </div>


        <!-- FORM -->

        <div class="sales-body">

            <form method="POST">

                {% csrf_token %}


                <!-- Non-field errors -->

                {% if form.non_field_errors %}

                    {{ form.non_field_errors }}

                {% endif %}


                <!-- Django form -->

                {{ form.as_p }}


                <!-- BUTTONS -->

                <div class="button-area">

                    <a
                        href="{% url 'admin_dashboard' %}"
                        class="btn-cancel"
                    >
                        <i class="fa-solid fa-arrow-left"></i>
                        Cancel
                    </a>


                    <button
                        type="submit"
                        class="btn-save"
                    >
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Sales Member
                    </button>

                </div>


            </form>

        </div>

    </div>

</div>

{% endblock %}
