{% extends "base.html" %}

{% block content %}

<style>

    /* ==============================
       PAGE
    ============================== */

    .sales-page {
        min-height: calc(100vh - 100px);
        padding: 40px 20px;
        background: #f4f6f9;
    }


    /* ==============================
       CARD
    ============================== */

    .sales-card {
        width: 100%;
        max-width: 800px;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        overflow: hidden;
    }


    /* ==============================
       HEADER
    ============================== */

    .sales-header {
        background: #0B2D52;
        color: white;
        padding: 28px 35px;
    }

    .sales-header h2 {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
    }

    .sales-header p {
        margin: 7px 0 0;
        font-size: 15px;
        color: #dce8f5;
    }


    /* ==============================
       FORM BODY
    ============================== */

    .sales-body {
        padding: 35px;
    }


    /* ==============================
       FORM ROW
    ============================== */

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        margin-bottom: 20px;
    }


    /* ==============================
       LABEL
    ============================== */

    .sales-body label {
        display: block;
        margin-bottom: 8px;
        font-size: 15px;
        font-weight: 600;
        color: #263238;
    }


    /* ==============================
       INPUT
    ============================== */

    .sales-body input {
        width: 100%;
        height: 48px;
        padding: 10px 14px;
        border: 1px solid #d4dce5;
        border-radius: 8px;
        background: white;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
    }

    .sales-body input:focus {
        border-color: #1565c0;
        box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
    }


    /* ==============================
       ERROR
    ============================== */

    .error-message {
        margin-bottom: 20px;
        padding: 12px 15px;
        background: #f8d7da;
        color: #842029;
        border-radius: 8px;
        font-size: 14px;
    }


    /* ==============================
       BUTTON AREA
    ============================== */

    .button-area {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 30px;
        padding-top: 25px;
        border-top: 1px solid #e5e7eb;
    }


    /* ==============================
       SAVE BUTTON
    ============================== */

    .btn-save {
        border: none;
        background: #198754;
        color: white;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-save:hover {
        background: #157347;
    }


    /* ==============================
       CANCEL BUTTON
    ============================== */

    .btn-cancel {
        display: inline-block;
        background: #6c757d;
        color: white;
        text-decoration: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-cancel:hover {
        background: #5c636a;
        color: white;
    }


    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 600px) {

        .sales-page {
            padding: 20px 10px;
        }

        .sales-body {
            padding: 25px 20px;
        }

        .sales-header {
            padding: 22px 20px;
        }

        .sales-header h2 {
            font-size: 24px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .button-area {
            flex-direction: column;
        }

        .btn-save,
        .btn-cancel {
            width: 100%;
            text-align: center;
        }

    }

</style>

<div class="sales-page">

<div class="sales-card">

    <!-- HEADER -->

    <div class="sales-header">

        <h2>
            <i class="fa-solid fa-user-plus"></i>
            Add Sales Member
        </h2>

        <p>
            Create a new sales member account
        </p>

    </div>


    <!-- FORM -->

    <div class="sales-body">

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <!-- FIRST NAME + LAST NAME -->

            <div class="form-row">

                <div class="form-group">

                    <label for="first_name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        placeholder="Enter first name"
                        value="{{ request.POST.first_name|default:'' }}"
                    >

                </div>


                <div class="form-group">

                    <label for="last_name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        placeholder="Enter last name"
                        value="{{ request.POST.last_name|default:'' }}"
                    >

                </div>

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    value="{{ request.POST.username|default:'' }}"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    value="{{ request.POST.email|default:'' }}"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- BUTTONS -->

            <div class="button-area">

                <a
                    href="{% url 'sales_members' %}"
                    class="btn-cancel"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Cancel
                </a>


                <button
                    type="submit"
                    class="btn-save"
                >
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Sales Member
                </button>

            </div>

        </form>

    </div>

</div>


</div>

{% endblock %}
