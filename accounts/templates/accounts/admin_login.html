{% load static %}

<!DOCTYPE html>

<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    .forgot-password {
        display: block;
        text-align: right;
        margin-top: -5px;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .forgot-password a {
        color: #0b2d52;
        text-decoration: none;
        font-weight: 500;
    }

    .forgot-password a:hover {
        text-decoration: underline;
    }

</style>

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card shadow">

<div class="card-header bg-primary text-white text-center">

<h3>Admin Login</h3>

</div>

<div class="card-body">

{% if error %}

<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST" action="{% url 'admin_login' %}">

{% csrf_token %}

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="forgot-password">

<a href="{% url 'admin_forgot_password' %}">

Forgot Password?

</a>

</div>

<button
type="submit"
class="btn btn-primary w-100">

Login

</button>

</form>

<a href="{% url 'home' %}" class="btn btn-secondary w-100 mt-3">

Back to Home

</a>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
